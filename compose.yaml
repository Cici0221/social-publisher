services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: publisher
      POSTGRES_USER: publisher
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-publisher-dev}
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U publisher -d publisher"]
      interval: 2s
      timeout: 4s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 4s
      retries: 30

  s3:
    image: ${S3_IMAGE:-chrislusf/seaweedfs:4.55}
    command: ["mini", "-dir=/data", "-s3.port=9000", "-s3.allowedOrigins=${APP_URL:-http://localhost:3000}"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-publisher-dev}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-local-media-only}
      S3_BUCKET: ${S3_BUCKET:-publisher-media}
    tmpfs:
      - /tmp
    volumes:
      - media:/data
    ports:
      - "127.0.0.1:59000:9000"

  web:
    build: .
    image: social-publisher-local
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      s3:
        condition: service_started
    env_file:
      - .env
    environment: &app_environ
      DATABASE_URL: postgresql://publisher:${POSTGRES_PASSWORD:-publisher-dev}@db:5432/publisher
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://s3:9000
    command: ["sh", "-c", "npm run db:deploy && npm run bootstrap && exec npm start"]
    ports:
      - "127.0.0.1:3000:3000"
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 4s
      timeout: 3s
      retries: 30

  worker:
    image: social-publisher-local
    pull_policy: never
    depends_on:
      web:
        condition: service_healthy
    env_file:
      - .env
    environment: *app_environ
    command: ["npm", "run", "worker"]
    restart: unless-stopped
    init: true

volumes:
  postgres:
  redis:
  media:
